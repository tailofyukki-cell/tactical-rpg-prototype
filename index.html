<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gridbound Tactics Prototype</title>
  <link rel="stylesheet" href="src/styles.css">
</head>
<body>
  <main id="app">
    <section class="game-shell">
      <canvas id="game" width="960" height="640" aria-label="2D tactical RPG battle map"></canvas>
      <aside class="panel">
        <h1>Gridbound Tactics</h1>
        <div id="phase" class="phase"></div>
        <div class="section">
          <h2>Turn Order</h2>
          <ol id="turnOrder" class="turn-order"></ol>
        </div>
        <div class="section">
          <h2>Unit</h2>
          <div id="unitInfo" class="info"></div>
        </div>
        <div class="section">
          <h2>Terrain</h2>
          <div id="terrainInfo" class="info"></div>
        </div>
        <div class="section">
          <h2>Commands</h2>
          <div id="commands" class="commands"></div>
        </div>
        <div id="prediction" class="prediction"></div>
        <div id="log" class="log"></div>
      </aside>
    </section>
  </main>
  <script type="module" src="src/game.js"></script>
</body>
</html>
